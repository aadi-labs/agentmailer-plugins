interface:
  display_name: "AgentMailer Human Channels"
  short_description: "Operate consented SMS, MMS, RCS, WhatsApp, and voice"
  default_prompt: "Use $agentmailer-channels to communicate with a person over an approved AgentMailer channel and preserve consent, delivery, and conversation state."
dependencies:
  tools:
    - type: "mcp"
      value: "agentmailer"
      description: "Operate AgentMailer human communication channels"
      transport: "streamable_http"
      url: "https://api.agentmailer.ai/mcp"
policy:
  allow_implicit_invocation: true
