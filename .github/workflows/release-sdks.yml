name: Release SDKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact synchronized SDK version, without v
        required: true
        type: string
      publish:
        description: Publish to public registries after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release-version.mjs "${{ inputs.version }}"
      - run: pnpm check

  npm:
    needs: validate
    runs-on: ubuntu-latest
    environment: client-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentmailer/sdk test:unit -- --run
      - run: pnpm --filter @agentmailer/sdk build
      - run: pnpm --filter @agentmailer/sdk pack --pack-destination /tmp
      - if: ${{ inputs.publish }}
        run: npm publish --provenance --access public
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: validate
    runs-on: ubuntu-latest
    environment: client-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build sdk/python
      - if: ${{ inputs.publish }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

  crates:
    needs: validate
    runs-on: ubuntu-latest
    environment: client-release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path sdk/rust/Cargo.toml
      - run: cargo package --manifest-path sdk/rust/Cargo.toml
      - if: ${{ inputs.publish }}
        run: cargo publish --manifest-path sdk/rust/Cargo.toml --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  rubygems:
    needs: validate
    runs-on: ubuntu-latest
    environment: client-release
    defaults:
      run:
        working-directory: sdk/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem build AgentMailer.gemspec
      - if: ${{ inputs.publish }}
        run: |
          mkdir -p ~/.gem
          printf -- '---\n:rubygems_api_key: %s\n' "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push agentmailer-${{ inputs.version }}.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
