name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests and skills
        run: python3 scripts/validate.py
      - name: Verify Skills CLI discovery
        run: npx --yes skills add . --list
