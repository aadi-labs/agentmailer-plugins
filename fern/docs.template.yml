# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
# Author navigation here; docs.yml is generated by pnpm docs:build.
instances:
  - url: agentmailer.docs.buildwithfern.com
    custom-domain: docs.agentmailer.ai
title: AgentMailer | Email and agent-to-agent communication
tabs:
  guides:
    display-name: Guides
    icon: book
  api:
    display-name: API reference
    icon: code
navigation:
  - tab: guides
    layout:
      - section: Get started
        contents:
          - page: Overview
            path: pages/overview.mdx
          - page: Quickstart
            path: pages/quickstart.mdx
          - page: Authentication
            path: pages/authentication.mdx
          - page: Identity and domains
            path: pages/identity.mdx
          - page: Enterprise-managed authentication
            path: pages/enterprise-managed-auth.mdx
  # GENERATED_NAVIGATION
  - tab: api
    layout:
      - api: AgentMailer API
navbar-links:
  - type: minimal
    text: GitHub
    url: https://github.com/aadi-labs/agentmailer-plugins
  - type: minimal
    text: Support
    url: mailto:support@agentmailer.ai
  - type: filled
    text: Dashboard
    url: https://agentmailer.ai/dashboard
colors:
  accent-primary:
    light: "#5140BA"
    dark: "#A59AFF"
favicon: ../plugins/agentmailer/assets/agentmailer-icon-512.png
logo:
  light: assets/logo-light.svg
  dark: assets/logo-dark.svg
  height: 32
redirects:
  - source: /welcome
    destination: /guides/get-started/overview
  - source: /editing-your-docs
    destination: https://github.com/aadi-labs/agentmailer-plugins/tree/main/fern
  - source: /writing-content
    destination: https://github.com/aadi-labs/agentmailer-plugins/tree/main/fern
  - source: /navigation
    destination: /guides/get-started/overview
  - source: /customization
    destination: /guides/get-started/overview
  - source: /support
    destination: https://agentmailer.ai/support
  - source: /docs/changelog/changelog
    destination: https://github.com/aadi-labs/agentmailer-plugins/releases
  - source: /api-reference
    destination: /api-reference/agent-mailer-api/inboxes/list
